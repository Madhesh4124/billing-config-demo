[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "billing-config-demo"
version = "0.1.0"
description = "Sample billing configuration and HTTP client service for testing dependency upgrade risk analysis"
requires-python = ">=3.11"
dependencies = [
    "attrs==23.2.0",
    "httpx==0.28.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
